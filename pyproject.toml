[tool.ruff]

target-version = "py310"

exclude = [
	"extensions",
	"extensions-disabled",
	"modules",
	"modules_forge",
	"ldm_patched",
	"repositories",
	"lean_proofs",
	# third-party annotator/model libs bundled inside extensions-builtin preprocessors
	"extensions-builtin/forge_legacy_preprocessors/annotator",
	"extensions-builtin/forge_preprocessor_inpaint/annotator",
	"extensions-builtin/forge_preprocessor_normalbae/annotator",
	"extensions-builtin/forge_preprocessor_marigold/marigold",
]

[tool.ruff.lint]

extend-select = [
  "B",
  "C",
  "I",
  "W",
]

ignore = [
	"E501", # Line too long
	"E721", # Do not compare types, use `isinstance`
	"E731", # Do not assign a `lambda` expression, use a `def`

	"I001", # Import block is un-sorted or un-formatted
	"C901", # Function is too complex
	"C408", # Rewrite as a literal
	"W605", # invalid escape sequence, messes with some docstrings
]

[tool.ruff.lint.per-file-ignores]
"webui.py" = ["E402"]  # Module level import not at top of file
"k_diff/**" = ["F401", "B023", "B028", "B904"]  # upstream k-diffusion code
"mlx_pipeline/**" = ["F821"]  # mx/torch are optional runtime imports on Apple Silicon
"typings/**" = ["F821"]  # type stubs — semver etc. are runtime-only names
"extensions-builtin/forge_legacy_preprocessors/legacy_preprocessors/preprocessor_compiled.py" = ["F403", "F405"]  # star-import by design
"extensions-builtin/sd_forge_latent_modifier/**" = ["E402"]  # intentional late imports
"extensions-builtin/sd_forge_multidiffusion/**" = ["E402", "F811"]  # intentional late imports

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBasic", "fastapi.Body"]

[tool.pytest.ini_options]
base_url = "http://127.0.0.1:7860"
filterwarnings = [
    "ignore::pytest.PytestConfigWarning:_pytest.config",
]
