version: 2
updates:
  # Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "PYCMS"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor/patch updates together to reduce PR noise
    groups:
      torch-ecosystem:
        patterns:
          - "torch*"
          - "torchvision*"
          - "torchaudio*"
          - "torchsde*"
          - "torchdiffeq*"
      diffusers-ecosystem:
        patterns:
          - "diffusers*"
          - "transformers*"
          - "accelerate*"
          - "huggingface*"
      image-processing:
        patterns:
          - "Pillow*"
          - "pillow*"
          - "opencv*"
          - "scikit-image*"
          - "kornia*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These are pinned for compatibility — only update intentionally
      - dependency-name: "gradio"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      # Blocked by gradio==3.41.2 (numpy<2) / deliberate pins — upgrade manually
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
      - dependency-name: "httpcore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "setuptools"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
